# Checks out the sibling crates that Cargo.toml reaches through `path = "../<sibling>"`.
# Cargo fails on a missing path dependency even when it has a `version`, so every job that
# resolves dependencies checks this repository out into $GITHUB_WORKSPACE/planning-heuristics
# (a local action needs the repository on disk first) and then calls this action.
# Siblings are checked out at their default branch into $GITHUB_WORKSPACE/<sibling>:
# search-core, merge-and-shrink and cost-partition (optional features) and width-search
# (dev-dependency).
# Public siblings need no token. Add a private sibling with
# `token: ${{ secrets.SIBLING_REPOS_TOKEN }}` (fine-grained PAT, contents read-only).
name: Check out sibling crates
description: Check out the sibling path dependencies next to planning-heuristics

runs:
  using: composite
  steps:
    - name: Check out search-core
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/search-core
        path: search-core
        persist-credentials: false
    - name: Check out merge-and-shrink
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/merge-and-shrink
        path: merge-and-shrink
        persist-credentials: false
    - name: Check out cost-partition
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/cost-partition
        path: cost-partition
        persist-credentials: false
    - name: Check out width-search
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/width-search
        path: width-search
        persist-credentials: false

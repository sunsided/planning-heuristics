[package]
name = "planning-heuristics"
description = "Heuristics for classical planning: red-black, FF, landmark and abstraction heuristic adapters"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/planning-heuristics"
readme = "README.md"
keywords = ["planning", "heuristic", "sas", "red-black", "landmarks"]
categories = ["algorithms", "science", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[features]
## Heuristic impl for merge-and-shrink's MergeAndShrinkHeuristic.
merge-and-shrink = ["dep:merge-and-shrink"]
## Heuristic impls for cost-partition's saturated cost partitioning.
cost-partition = ["dep:cost-partition"]
## Optimal landmark cost partitioning by linear programming (microlp; pulls in std and
## needs Rust 1.86).
lp = ["dep:microlp"]

# Sibling crates come from crates.io; local development patches them to the sibling working
# trees through the planning hub's .cargo/config.toml (see CONTRIBUTING.md).
[dependencies]
# The shared Heuristic trait, re-exported from the crate root (see docs/design.md).
search-core = "0.3"
sas-plus = { version = "0.2.1", default-features = false }
# MergeAndShrinkHeuristic::value needs 0.3 (see docs/design.md).
merge-and-shrink = { version = "0.3.0", default-features = false, optional = true }
# MaxOverOrders needs 0.2 (see docs/design.md).
cost-partition = { version = "0.2.0", default-features = false, optional = true }

# Pure-Rust simplex; std only, so it stays behind the `lp` feature.
microlp = { version = "0.8.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
proptest = "1.12"
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }
# Needs SasProblem::h_add, which width-search ships since 0.3 (see docs/design.md).
width-search = { version = "0.3", features = ["sas-plus"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
mod_module_files = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bench]]
name = "relaxation"
harness = false

[package]
name = "planning-heuristics"
description = "Heuristics for classical planning: red-black, FF, landmark and abstraction heuristic adapters"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/planning-heuristics"
readme = "README.md"
keywords = ["planning", "heuristic", "sas", "red-black", "landmarks"]
categories = ["algorithms", "science", "no-std"]

[features]
## Heuristic impl for merge-and-shrink's MergeAndShrinkHeuristic.
merge-and-shrink = ["dep:merge-and-shrink"]
## Heuristic impls for cost-partition's saturated cost partitioning.
cost-partition = ["dep:cost-partition"]
## Optimal landmark cost partitioning by linear programming (microlp; pulls in std and
## needs Rust 1.86).
lp = ["dep:microlp"]

[dependencies]
# Unreleased: the shared Heuristic trait (see docs/design.md).
search-core = { path = "../search-core", version = "0.1" }
sas-plus = { version = "0.2.1", default-features = false }
# Unreleased: MergeAndShrinkHeuristic::value needs 0.3.0 (see docs/design.md).
merge-and-shrink = { path = "../merge-and-shrink", version = "0.3.0", default-features = false, optional = true }
# Unreleased: MaxOverOrders needs 0.2.0 (see docs/design.md).
cost-partition = { path = "../cost-partition", version = "0.2.0", default-features = false, optional = true }

# Pure-Rust simplex; std only, so it stays behind the `lp` feature.
microlp = { version = "0.8.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }
# Needs SasProblem::h_add, which no published width-search has yet (see docs/design.md).
width-search = { path = "../width-search", version = "0.2.0", features = ["sas-plus"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
mod_module_files = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[[bench]]
name = "relaxation"
harness = false
